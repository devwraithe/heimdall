[package]
name = "state"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
prost = "0.14.4"
tokio = { version = "1.52.3", features = ["full"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"

shared = { path = "../shared" }
tracking = { path = "../tracking" }
tokio-stream = { version = "0.1.18", features = ["net"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
