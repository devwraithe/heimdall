yellowstone-grpc-client = "13"
yellowstone-grpc-proto = "12"

intelligence = { path = "../intelligence" }
shared = { path = "../shared" }
state = { path = "../state" }
submission = { path = "../submission" }
tracking = { path = "../tracking" }