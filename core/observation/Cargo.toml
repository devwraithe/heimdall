[package]
name = "observation"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
futures = "0.3"
dotenvy = "0.15"
solana-client = "4"
solana-sdk = "4"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tracing = "0.1"
