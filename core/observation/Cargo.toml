[package]
name = "observation"
version = "0.1.0"
edition = "2024"

[dependencies]
# Yellowstone gRPC client
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = "12.4.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC transport
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }

# Env vars
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

anyhow = "1.0.102"
futures = "0.3.32"
solana-client = "4.0.0"
solana-sdk = "4.0.1"
